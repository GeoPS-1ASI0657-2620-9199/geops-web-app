<form class="form" (ngSubmit)="submit()">
  <h2 class="title">{{ 'reportForm.title' | translate }}</h2>
  <p class="hint">{{ 'reportForm.hint' | translate }}</p>
  <label class="label" for="reason">{{ 'reportForm.reason' | translate }}</label>
  <textarea
    id="reason"
    name="reason"
    class="input"
    rows="4"
    [maxlength]="max"
    [ngModel]="reason()"
    (ngModelChange)="reason.set($event)"
    [placeholder]="'reportForm.placeholder' | translate"></textarea>
  <p class="counter" [class.bad]="length() > 0 && !valid()" data-testid="reason-counter">
    {{ 'reportForm.counter' | translate: { length: length(), min: min, max: max } }}
  </p>
  @if (errorMessage() !== null) {
    <geo-alert
      kind="error"
      [title]="'reportForm.error' | translate"
      [description]="errorMessage() || ('reportForm.errorRetry' | translate)" />
  }
  <div class="actions">
    <button mat-stroked-button type="button" (click)="cancelled.emit()">{{ 'reportForm.cancel' | translate }}</button>
    <button mat-flat-button type="submit" [disabled]="!valid() || sending()">
      {{ (sending() ? 'reportForm.sending' : 'reportForm.send') | translate }}
    </button>
  </div>
</form>
